name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            package: macOS-arm64
          - os: macos-15-intel
            package: macOS-x64
          - os: windows-2022
            package: Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Restore libraries
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build-native/deps/qt-install
            build-native/deps/opencv-install
            build-native/deps/openssl-install
            build-native/deps/vcpkg/installed
          key: static-libraries-${{ matrix.package }}-${{ hashFiles('packaging/build.cmake', 'packaging/host-crypto-macos.sh', 'cmake/StaticQt.cmake', 'cmake/ReleaseVision.cmake') }}
      - name: Build and package Mac
        if: runner.os == 'macOS'
        run: |
          command -v ninja || brew install ninja
          bash build.sh
      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: build.cmd
      - name: Save libraries
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build-native/deps/qt-install
            build-native/deps/opencv-install
            build-native/deps/openssl-install
            build-native/deps/vcpkg/installed
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.package }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - run: cmake -S . -B build -DHIVE_BUILD_DESKTOP=OFF -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build --parallel 3
