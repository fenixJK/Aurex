name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            host: mac
            arch: clang_64
            directory: macos
            package: macOS-arm64
          - os: macos-15-intel
            host: mac
            arch: clang_64
            directory: macos
            package: macOS-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt ${{ matrix.host }} desktop 6.8.3 ${{ matrix.arch }} --modules qtwebsockets --archives qtbase qtwebsockets -O "${{ runner.temp }}/Qt"
          "${{ runner.temp }}/Qt/6.8.3/${{ matrix.directory }}/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install host identity library
        shell: pwsh
        run: |
          bash packaging/host-crypto-macos.sh "$env:RUNNER_TEMP"
          if ($LASTEXITCODE) { throw 'OpenSSL build failed' }
          "OPENSSL_ROOT_DIR=$env:RUNNER_TEMP/openssl-install" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Cache vision libraries
        id: vision
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/opencv-install
          key: opencv-4.13-${{ hashFiles('cmake/ReleaseVision.cmake') }}-${{ matrix.os }}-${{ runner.arch }}
      - name: Build vision libraries
        if: steps.vision.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/opencv/opencv/archive/refs/tags/4.13.0.tar.gz -OutFile "$env:RUNNER_TEMP/opencv.tar.gz"
          if ((Get-FileHash "$env:RUNNER_TEMP/opencv.tar.gz" -Algorithm SHA256).Hash.ToLower() -ne '1d40ca017ea51c533cf9fd5cbde5b5fe7ae248291ddf2af99d4c17cf8e13017d') { throw 'OpenCV archive checksum mismatch' }
          tar -xzf "$env:RUNNER_TEMP/opencv.tar.gz" -C "$env:RUNNER_TEMP"
          $extra = @()
          if ($IsMacOS) { $extra += '-DCMAKE_OSX_DEPLOYMENT_TARGET=14.0' }
          cmake -S "$env:RUNNER_TEMP/opencv-4.13.0" -B "$env:RUNNER_TEMP/opencv-build" "-DCMAKE_INSTALL_PREFIX=$env:RUNNER_TEMP/opencv-install" -DCMAKE_BUILD_TYPE=Release -C cmake/ReleaseVision.cmake @extra
          if ($LASTEXITCODE) { throw 'OpenCV configuration failed' }
          cmake --build "$env:RUNNER_TEMP/opencv-build" --config Release --parallel 3
          if ($LASTEXITCODE) { throw 'OpenCV build failed' }
          cmake --install "$env:RUNNER_TEMP/opencv-build" --config Release
          if ($LASTEXITCODE) { throw 'OpenCV installation failed' }
      - name: Save vision libraries
        if: steps.vision.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/opencv-install
          key: ${{ steps.vision.outputs.cache-primary-key }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DOpenCV_STATIC=ON -DCMAKE_PREFIX_PATH="${{ runner.temp }}/Qt/6.8.3/${{ matrix.directory }};${{ runner.temp }}/opencv-install"
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Package macOS
        run: bash packaging/macos.sh "${{ matrix.package }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.package }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Restore static dependencies
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build-windows-static/deps/Qt/6.8.3/windows-static
            build-windows-static/deps/opencv-install
            build-windows-static/deps/vcpkg/installed
          key: windows-static-${{ hashFiles('packaging/build.py', 'cmake/WindowsQt.cmake', 'cmake/ReleaseVision.cmake') }}
      - name: Build and package Windows
        run: python packaging/build.py
      - name: Save static dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            build-windows-static/deps/Qt/6.8.3/windows-static
            build-windows-static/deps/opencv-install
            build-windows-static/deps/vcpkg/installed
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Windows-x64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - run: cmake -S . -B build -DHIVE_BUILD_DESKTOP=OFF -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - run: cmake --build build --parallel 3
